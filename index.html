<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Interactive Comments Section</title>
    <script src="script.js" defer></script>
</head>

<body>
    <main class="comments comments__container">

        <!-- Dynamic Comment Threads Container -->
        <ul class="comments__list" id="comments-list">
            <!-- Inject comment threads here with JavaScript -->
        </ul>

        <!-- Add New Comment Form -->
        <form class="comment__form" id="comment-form">
            <img src="" alt="" id="current-user-avatar" class="comment__form-avatar" />
            <textarea class="comment__form-input" id="comment-input" placeholder="Add a comment..." rows="3" aria-label="Add a comment" required></textarea>
            <button type="submit" class="comment__form-button">Send</button>
        </form>

    </main>
</body>

</html>
