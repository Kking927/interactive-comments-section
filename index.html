<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Interactive Comments Section</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <main class="comments comments__container">

        <!-- Add primary heading, so page starts with an h1 -->
        <h1 class="visually-hidden">Interactive Comments Section</h1>

        <!-- Dynamic Comment Threads Container -->
        <ul class="comments__list" id="comments-list">
            <!-- Inject comment threads here with JavaScript -->
            <li class="loading-item">
                <p class="loading-text">Loading comments...</p>
            </li>
        </ul>

        <!-- Add New Comment Form -->
        <form class="comment__form" id="comment-form">
            <img src="" alt="" id="current-user-avatar" class="comment__form-avatar" />
            <textarea class="comment__form-input" id="comment-input" placeholder="Add a comment..." rows="3"
                aria-label="Add a comment" required></textarea>
            <button type="submit" class="comment__form-button">Send</button>
        </form>

    </main>

    <div class="modal-wrapper invisible" id="delete-modal">
        <div class="modal">
            <h3>Delete comment</h3>
            <p>Are you sure you want to delete this comment? This will remove the comment and can’t be undone.</p>
            <div class="modal__buttons">
                <button type="button" class="btn btn--cancel" id="cancel-delete-btn">No, cancel</button>
                <button type="button" class="btn btn--danger" id="confirm-delete-btn">Yes, delete</button>
            </div>
        </div>
    </div>

</body>

</html>
